name: Secondary PC acceptance artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondary-pc-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-acceptance-artifact:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout requested branch commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build exact commit
        shell: pwsh
        run: python build.py

      - name: Smoke test packaged API
        shell: pwsh
        run: python scripts/packaged_api_smoke.py --exe dist/Catalyst/Catalyst.exe --timeout 120

      - name: Smoke test packaged Sage RPC worker
        shell: pwsh
        run: python scripts/packaged_sage_rpc_smoke.py --exe dist/Catalyst/Catalyst.exe --timeout 120

      - name: Smoke test interrupted-publication recovery
        shell: pwsh
        run: python scripts/packaged_upgrade_publication_recovery_smoke.py --exe dist/Catalyst/Catalyst.exe --timeout 120

      - name: Write identity manifest and package
        id: package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $exe = "dist/Catalyst/Catalyst.exe"
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          @"
          CATalyst secondary-PC acceptance artifact
          Repository: $($env:GITHUB_REPOSITORY)
          Branch/ref: $($env:GITHUB_REF)
          Source commit: $commit
          Workflow run: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)
          Executable SHA-256: $exeHash
          Packaged API smoke: PASS
          Packaged Sage RPC smoke: PASS
          Packaged publication recovery smoke: PASS
          "@ | Set-Content -Encoding utf8 dist/Catalyst/ACCEPTANCE_BUILD.txt
          $archive = "CATalyst-secondary-pc-$($commit.Substring(0, 8)).zip"
          Compress-Archive -Path dist/Catalyst/* -DestinationPath $archive
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          "$archiveHash  $archive" | Set-Content -NoNewline -Encoding ascii "$archive.sha256"
          "artifact_name=CATalyst-secondary-pc-$($commit.Substring(0, 8))" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "archive_sha256=$archiveHash" >> $env:GITHUB_OUTPUT
          "exe_sha256=$exeHash" >> $env:GITHUB_OUTPUT

      - name: Upload acceptance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish checksums in run summary
        shell: pwsh
        env:
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          EXE_SHA256: ${{ steps.package.outputs.exe_sha256 }}
        run: |
          @"
          ## Secondary-PC acceptance artifact

          - Source commit: ``$($env:GITHUB_SHA)``
          - ZIP SHA-256: ``$($env:ARCHIVE_SHA256)``
          - ``Catalyst.exe`` SHA-256: ``$($env:EXE_SHA256)``
          - This is a temporary workflow artifact, not a release.
          "@ >> $env:GITHUB_STEP_SUMMARY
