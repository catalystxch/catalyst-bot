name: Deep Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  schedule:
    # Weekly dependency/supply-chain sweep, separate from Dependabot.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.161.0"

      - name: Run Semgrep community rules
        run: semgrep scan --config=p/ci --error --metrics=off

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Run Gitleaks
        # Official v8.30.1 GHCR image, pinned to its published manifest digest.
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: detect --source=/github/workspace --no-banner --redact --exit-code=1 --verbose
