name: Build Release

# Triggers when you push a version tag (e.g. v1.0.0, v1.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Catalyst-windows
            ext: .zip
          - os: ubuntu-latest
            artifact: Catalyst-linux
            ext: .tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 (current ubuntu-latest) dropped libwebkit2gtk-4.0-dev —
          # use the 4.1 variant, falling back to 4.0 for older runner images.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
          sudo apt-get install -y desktop-file-utils file dpkg-dev fakeroot curl dbus-x11 libnotify-bin xvfb xdotool x11-apps openbox \
            libdbus-1-3 libegl1 libgl1 libgbm1 libnss3 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxkbcommon-x11-0 libxrandr2
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m pip install -r requirements-linux.txt
          fi

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync release metadata to tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          python scripts/sync_release_metadata.py "${RELEASE_VERSION}"
          echo "Synced release metadata to ${RELEASE_VERSION}"

      - name: Require Windows release signing configuration
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          CATALYST_UPDATE_SIGNING_KEY_B64: ${{ secrets.CATALYST_UPDATE_SIGNING_KEY_B64 }}
          CATALYST_RELEASE_CHANNEL_TOKEN: ${{ secrets.CATALYST_RELEASE_CHANNEL_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "SIGNPATH_API_TOKEN is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            throw "SIGNPATH_ORGANIZATION_ID is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:CATALYST_UPDATE_SIGNING_KEY_B64)) {
            throw "CATALYST_UPDATE_SIGNING_KEY_B64 is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:CATALYST_RELEASE_CHANNEL_TOKEN)) {
            throw "CATALYST_RELEASE_CHANNEL_TOKEN is required"
          }

      - name: Build with PyInstaller
        run: python build.py

      - name: Smoke test packaged Sage RPC worker (Windows)
        if: matrix.os == 'windows-latest'
        run: python scripts/packaged_sage_rpc_smoke.py --exe dist/Catalyst/Catalyst.exe

      - name: Smoke test packaged API runtime
        shell: bash
        run: |
          exe="dist/Catalyst/Catalyst"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exe="dist/Catalyst/Catalyst.exe"
          fi
          python scripts/packaged_api_smoke.py --exe "$exe"

      - name: Smoke test upgrade-interrupted publication recovery (Windows)
        if: matrix.os == 'windows-latest'
        run: python scripts/packaged_upgrade_publication_recovery_smoke.py --exe dist/Catalyst/Catalyst.exe

      - name: Upload unsigned CATalyst application for SignPath
        id: upload-unsigned-application
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalyst-windows-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/Catalyst/Catalyst.exe
          archive: false

      - name: Sign CATalyst application with SignPath
        id: sign-application
        if: matrix.os == 'windows-latest'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: catalyst
          signing-policy-slug: release-signing
          artifact-configuration-slug: catalyst-windows-application-v1
          github-artifact-id: ${{ steps.upload-unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/application
          skip-decompress: true
          parameters: |
            version: "${{ steps.release-version.outputs.version }}"

      - name: Replace and verify signed CATalyst application
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $signedApplication = "signed/application/Catalyst.exe"
          if (-not (Test-Path -LiteralPath $signedApplication)) {
            throw "SignPath did not return Catalyst.exe"
          }
          Copy-Item -LiteralPath $signedApplication -Destination "dist/Catalyst/Catalyst.exe" -Force
          python scripts/verify_windows_authenticode.py `
            --file "dist/Catalyst/Catalyst.exe" `
            --expected-version "$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) {
            throw "Signed CATalyst application verification failed"
          }

      - name: Package signed Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          RELEASE_REF: ${{ github.ref_name }}
          PACKAGE_EXT: ${{ matrix.ext }}
        run: |
          $package = "${env:ARTIFACT_NAME}-${env:RELEASE_REF}${env:PACKAGE_EXT}"
          Compress-Archive -Path dist/Catalyst/* -DestinationPath $package

      - name: Build Windows installer from signed application
        if: matrix.os == 'windows-latest'
        env:
          RELEASE_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install Inno Setup
          choco install innosetup --yes --no-progress
          # Generate release notes for the in-app updater manifest.
          gh api "repos/$($env:GITHUB_REPOSITORY)/releases/generate-notes" `
            -f tag_name="$($env:RELEASE_REF)" `
            --jq ".body" | Set-Content release_notes_generated.md
          python scripts/sanitize_release_notes.py `
            release_notes_generated.md `
            release_notes.md `
            --private-repo "$($env:GITHUB_REPOSITORY)"
          # Update version in installer script to match tag
          $version = $env:RELEASE_REF.TrimStart("v")
          (Get-Content installer.iss) -replace 'MyAppVersion     ".*"', "MyAppVersion     `"$version`"" | Set-Content installer.iss
          # Build installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          # Rename output to match release naming
          Move-Item "Output\Catalyst-Setup-$version.exe" "Catalyst-Setup-$($env:RELEASE_REF).exe"
        shell: pwsh

      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalyst-windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: Catalyst-Setup-${{ github.ref_name }}.exe
          archive: false

      - name: Sign Windows installer with SignPath
        id: sign-installer
        if: matrix.os == 'windows-latest'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: catalyst
          signing-policy-slug: release-signing
          artifact-configuration-slug: catalyst-windows-installer-v1
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installer
          skip-decompress: true
          parameters: |
            version: "${{ steps.release-version.outputs.version }}"

      - name: Replace and verify signed Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          GITHUB_SERVER: ${{ github.server_url }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          APPLICATION_SIGNING_REQUEST_ID: ${{ steps.sign-application.outputs.signing-request-id }}
          INSTALLER_SIGNING_REQUEST_ID: ${{ steps.sign-installer.outputs.signing-request-id }}
        run: |
          $installer = "Catalyst-Setup-$($env:RELEASE_REF).exe"
          $signedInstaller = "signed/installer/$installer"
          if (-not (Test-Path -LiteralPath $signedInstaller)) {
            throw "SignPath did not return $installer"
          }
          Copy-Item -LiteralPath $signedInstaller -Destination $installer -Force
          python scripts/verify_windows_authenticode.py `
            --file "$installer" `
            --expected-version "$($env:RELEASE_VERSION)" `
            --evidence-output "windows-signature-$($env:RELEASE_REF).json" `
            --source-repository "$($env:SOURCE_REPOSITORY)" `
            --source-tag "$($env:RELEASE_REF)" `
            --source-commit "$($env:SOURCE_COMMIT)" `
            --workflow-run-url "$($env:GITHUB_SERVER)/$($env:SOURCE_REPOSITORY)/actions/runs/$($env:WORKFLOW_RUN_ID)" `
            --application-signing-request-id "$($env:APPLICATION_SIGNING_REQUEST_ID)" `
            --installer-signing-request-id "$($env:INSTALLER_SIGNING_REQUEST_ID)"
          if ($LASTEXITCODE -ne 0) {
            throw "Signed Windows installer verification failed"
          }

      - name: Generate signed-installer checksum and update manifest
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          CATALYST_UPDATE_SIGNING_KEY_B64: ${{ secrets.CATALYST_UPDATE_SIGNING_KEY_B64 }}
          CATALYST_RELEASE_CHANNEL_REPO: ${{ vars.CATALYST_RELEASE_CHANNEL_REPO || 'Lowestofttim/catalyst-releases' }}
        run: |
          $installer = "Catalyst-Setup-$($env:RELEASE_REF).exe"
          $digest = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$digest  $installer" | Set-Content "${installer}.sha256" -NoNewline
          if (-not $env:CATALYST_UPDATE_SIGNING_KEY_B64) {
            throw "CATALYST_UPDATE_SIGNING_KEY_B64 secret is required for signed updates"
          }
          python scripts/sign_update_manifest.py `
            --version "$($env:RELEASE_REF)" `
            --installer "$installer" `
            --sha256-file "${installer}.sha256" `
            --download-base-url "https://github.com/$($env:CATALYST_RELEASE_CHANNEL_REPO)/releases/download/$($env:RELEASE_REF)" `
            --release-url "https://github.com/$($env:CATALYST_RELEASE_CHANNEL_REPO)/releases/tag/$($env:RELEASE_REF)" `
            --release-notes-file release_notes.md `
            --out-manifest latest.json `
            --out-signature latest.json.sig
          Copy-Item latest.json "update-manifest-$($env:RELEASE_REF).json"
          Copy-Item latest.json.sig "update-manifest-$($env:RELEASE_REF).json.sig"

      - name: Smoke test signed Windows installer payload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $installer = Resolve-Path "Catalyst-Setup-$($env:RELEASE_REF).exe"
          $installDir = Join-Path $env:RUNNER_TEMP "CatalystInstall"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $installArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOICONS",
            "/DIR=$installDir"
          )
          $install = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          python scripts/packaged_api_smoke.py --exe (Join-Path $installDir "Catalyst.exe")

          Write-Host "Smoke test Windows clean desktop first launch"
          python scripts/packaged_desktop_first_launch_smoke.py --exe (Join-Path $installDir "Catalyst.exe")

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Wait | Out-Null
          }

          Write-Host "Smoke test Windows existing-install upgrade"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\CATalyst"
          if (Test-Path -LiteralPath $installDir) {
            throw "Existing-install smoke target unexpectedly exists: $installDir"
          }
          $bootstrapArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=$installDir"
          )
          $bootstrap = Start-Process -FilePath $installer -ArgumentList $bootstrapArgs -Wait -PassThru
          if ($bootstrap.ExitCode -ne 0) {
            throw "Initial same-user install exited with code $($bootstrap.ExitCode)"
          }

          $installedExe = Join-Path $installDir "Catalyst.exe"
          Set-Content -LiteralPath $installedExe -Value "legacy executable"
          $upgradeArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER"
          )
          $upgrade = Start-Process -FilePath $installer -ArgumentList $upgradeArgs -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "Existing-install upgrade exited with code $($upgrade.ExitCode)"
          }

          $expectedVersion = $env:RELEASE_REF.TrimStart("v")
          $installedVersion = (Get-Item -LiteralPath $installedExe).VersionInfo.ProductVersion
          if ($installedVersion -ne $expectedVersion) {
            throw "Existing-install upgrade left version $installedVersion; expected $expectedVersion"
          }

          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CATalyst.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath)) {
            throw "Existing-install upgrade did not refresh the CATalyst Start Menu shortcut"
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcutTarget = $shell.CreateShortcut($shortcutPath).TargetPath
          if ($shortcutTarget -ne $installedExe) {
            throw "CATalyst shortcut targets $shortcutTarget; expected $installedExe"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Wait | Out-Null
          }

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          RELEASE_REF: ${{ github.ref_name }}
          PACKAGE_EXT: ${{ matrix.ext }}
        run: |
          # Add .desktop file for Linux desktop integration
          cat > dist/Catalyst/catalyst.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=CATalyst
          Comment=Chia liquidity market maker
          Exec=Catalyst
          Icon=assets/bot_icon_new.png
          Terminal=false
          Categories=Finance;Network;
          DESKTOP
          package="../${ARTIFACT_NAME}-${RELEASE_REF}${PACKAGE_EXT}"
          cd dist && tar -czf "$package" Catalyst/

      - name: Package Linux AppImage and deb
        if: matrix.os == 'ubuntu-latest'
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: scripts/package_linux.sh "$RELEASE_REF"

      - name: Smoke test Linux packages
        if: matrix.os == 'ubuntu-latest'
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          appimage_path="Catalyst-linux-${RELEASE_REF}-x86_64.AppImage"
          deb_path="catalyst_${RELEASE_REF}_amd64.deb"
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/packaged_api_smoke.py --exe "$appimage_path"
          APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/linux_desktop_smoke.sh "$PWD/$appimage_path" appimage-desktop-smoke.log
          extract_dir="${RUNNER_TEMP}/catalyst-deb"
          mkdir -p "$extract_dir"
          dpkg-deb --info "$deb_path"
          dpkg-deb -x "$deb_path" "$extract_dir"
          python scripts/packaged_api_smoke.py --exe "$extract_dir/opt/catalyst/Catalyst"
          bash scripts/linux_desktop_smoke.sh "$extract_dir/opt/catalyst/Catalyst" deb-desktop-smoke.log

      - name: Upload Windows zip/Linux tar to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ matrix.artifact }}-${{ github.ref_name }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release create "$RELEASE_REF" \
              --title "CATalyst $RELEASE_REF" \
              --generate-notes \
              --draft \
              --latest || true
          fi
          for attempt in $(seq 1 10); do
            if gh release upload "$RELEASE_REF" "$RELEASE_ASSET" --clobber; then
              exit 0
            fi
            echo "Release upload retry $attempt for $RELEASE_ASSET"
            sleep 3
          done
          echo "Failed to upload $RELEASE_ASSET to $RELEASE_REF"
          exit 1

      - name: Upload Linux packages to Release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release create "$RELEASE_REF" \
              --title "CATalyst $RELEASE_REF" \
              --generate-notes \
              --draft \
              --latest || true
          fi
          assets=(
            "Catalyst-linux-${RELEASE_REF}-x86_64.AppImage"
            "Catalyst-linux-${RELEASE_REF}-x86_64.AppImage.sha256"
            "catalyst_${RELEASE_REF}_amd64.deb"
            "catalyst_${RELEASE_REF}_amd64.deb.sha256"
          )
          for attempt in $(seq 1 10); do
            if gh release upload "$RELEASE_REF" "${assets[@]}" --clobber; then
              exit 0
            fi
            echo "Release upload retry $attempt for Linux packages"
            sleep 3
          done
          echo "Failed to upload Linux packages to $RELEASE_REF"
          exit 1

      - name: Upload signed Windows installer to Release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          gh release view "$($env:RELEASE_REF)" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$($env:RELEASE_REF)" `
              --title "CATalyst $($env:RELEASE_REF)" `
              --generate-notes `
              --draft `
              --latest
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Release may already exist; upload step will retry."
            }
          }
          $assets = @(
            "Catalyst-Setup-$($env:RELEASE_REF).exe",
            "Catalyst-Setup-$($env:RELEASE_REF).exe.sha256",
            "windows-signature-$($env:RELEASE_REF).json",
            "latest.json",
            "latest.json.sig",
            "update-manifest-$($env:RELEASE_REF).json",
            "update-manifest-$($env:RELEASE_REF).json.sig"
          )
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            gh release upload "$($env:RELEASE_REF)" @assets --clobber
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Write-Host "Release upload retry $attempt for Windows installer assets"
            Start-Sleep -Seconds 3
          }
          throw "Failed to upload Windows installer assets to $($env:RELEASE_REF)"

      - name: Publish verified public update channel
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CATALYST_RELEASE_CHANNEL_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
          CATALYST_RELEASE_CHANNEL_REPO: ${{ vars.CATALYST_RELEASE_CHANNEL_REPO || 'Lowestofttim/catalyst-releases' }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "CATALYST_RELEASE_CHANNEL_TOKEN is required"
          }
          $assets = @(
            "Catalyst-Setup-$($env:RELEASE_REF).exe",
            "Catalyst-Setup-$($env:RELEASE_REF).exe.sha256",
            "windows-signature-$($env:RELEASE_REF).json",
            "latest.json",
            "latest.json.sig",
            "update-manifest-$($env:RELEASE_REF).json",
            "update-manifest-$($env:RELEASE_REF).json.sig"
          )
          gh release view "$($env:RELEASE_REF)" --repo "$($env:CATALYST_RELEASE_CHANNEL_REPO)" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$($env:RELEASE_REF)" @assets --repo "$($env:CATALYST_RELEASE_CHANNEL_REPO)" --clobber
          } else {
            gh release create "$($env:RELEASE_REF)" @assets `
              --repo "$($env:CATALYST_RELEASE_CHANNEL_REPO)" `
              --title "CATalyst $($env:RELEASE_REF)" `
              --notes-file release_notes.md `
              --latest
          }

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --draft=false --latest
