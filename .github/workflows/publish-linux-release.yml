name: Publish Linux release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to build (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-linux-release
  cancel-in-progress: false

jobs:
  publish-linux-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trusted main release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.tag }}
          SOURCE_REPOSITORY: catalystxch/catalyst-bot
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch --force origin main "refs/tags/${RELEASE_REF}:refs/tags/${RELEASE_REF}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_REF}")"
          main_commit="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "${tag_commit}" "${main_commit}"
          is_draft="$(gh release view "${RELEASE_REF}" --repo "${SOURCE_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" != "false" ]]; then
            echo "${RELEASE_REF} is not a public release" >&2
            exit 1
          fi
          echo "version=${RELEASE_REF#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout validated release tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/${RELEASE_REF}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
          sudo apt-get install -y desktop-file-utils file dpkg-dev fakeroot curl dbus-x11 libnotify-bin xvfb xdotool x11-apps openbox \
            libdbus-1-3 libegl1 libgl1 libgbm1 libnss3 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxkbcommon-x11-0 libxrandr2
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-linux.txt

      - name: Build with PyInstaller
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/sync_release_metadata.py "${RELEASE_VERSION}"
          python build.py

      - name: Package Linux releases
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cat > dist/Catalyst/catalyst.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=CATalyst
          Comment=Chia liquidity market maker
          Exec=Catalyst
          Icon=assets/bot_icon_new.png
          Terminal=false
          Categories=Finance;Network;
          DESKTOP
          tar -czf "Catalyst-linux-${RELEASE_REF}.tar.gz" -C dist Catalyst
          scripts/package_linux.sh "${RELEASE_REF}"

      - name: Smoke test Linux releases
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          appimage="Catalyst-linux-${RELEASE_REF}-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/packaged_api_smoke.py --exe "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/linux_desktop_smoke.sh "$PWD/${appimage}" appimage-desktop-smoke.log
          extract_dir="${RUNNER_TEMP}/catalyst-deb"
          mkdir -p "${extract_dir}"
          deb="catalyst_${RELEASE_REF}_amd64.deb"
          dpkg-deb --info "${deb}"
          dpkg-deb -x "${deb}" "${extract_dir}"
          python scripts/packaged_api_smoke.py --exe "${extract_dir}/opt/catalyst/Catalyst"
          bash scripts/linux_desktop_smoke.sh "${extract_dir}/opt/catalyst/Catalyst" deb-desktop-smoke.log

      - name: Upload Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.tag }}
          SOURCE_REPOSITORY: catalystxch/catalyst-bot
        run: |
          set -euo pipefail
          assets=(
            "Catalyst-linux-${RELEASE_REF}.tar.gz"
            "Catalyst-linux-${RELEASE_REF}-x86_64.AppImage"
            "Catalyst-linux-${RELEASE_REF}-x86_64.AppImage.sha256"
            "catalyst_${RELEASE_REF}_amd64.deb"
            "catalyst_${RELEASE_REF}_amd64.deb.sha256"
          )
          sha256sum --check "Catalyst-linux-${RELEASE_REF}-x86_64.AppImage.sha256"
          sha256sum --check "catalyst_${RELEASE_REF}_amd64.deb.sha256"
          existing="$(gh release view "${RELEASE_REF}" --repo "${SOURCE_REPOSITORY}" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            if grep -Fqx "${asset}" <<< "${existing}"; then
              echo "Release asset already exists and will not be replaced: ${asset}" >&2
              exit 1
            fi
          done
          gh release upload "${RELEASE_REF}" "${assets[@]}" --repo "${SOURCE_REPOSITORY}"

